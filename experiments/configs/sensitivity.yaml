# Hyperparameter Sensitivity: chunk_size x top_k grid
# Runs Simple RAG only (cheapest system) across all combinations

experiment:
  name: sensitivity
  description: >
    Grid search over chunk_size (256/512/1024) and top_k (3/5/10).
    9 conditions total on 100-question ablation subset.

model:
  generation: gemini-2.5-flash-preview-04-17
  temperature: 0.0
  max_output_tokens: 512

grid:
  chunk_sizes: [256, 512, 1024]
  top_k_values: [3, 5, 10]
  chunking_strategy: fixed

data:
  qa_path:     data/qa_dataset/qa_pairs_ablation.jsonl
  sample_meta: data/metadata/sample_50.csv

evaluation:
  run_faithfulness: true
  run_bertscore:    false
  run_retrieval:    true

output:
  results_base: results/additional/sensitivity
