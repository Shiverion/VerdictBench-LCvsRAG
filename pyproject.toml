[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lc-vs-rag-mk-verdicts"
version = "0.1.0"
description = "Comparative Study of Long Context vs RAG Architectures on Indonesian Constitutional Court Verdicts"
authors = [{ name = "Muhammad Iqbal Hilmy Izzulhaq" }]
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "tqdm>=4.66.0",
    "click>=8.1.0",
    "openai>=1.30.0",
    "faiss-cpu>=1.8.0",
    "numpy>=1.26.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0.0",
    "bert-score>=0.3.13",
    "transformers>=4.40.0",
    "torch>=2.2.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.13.0",
    "tiktoken>=0.7.0",
    "langchain-text-splitters>=0.2.0",
    "pandas>=2.2.0",
    "rich>=13.7.0",
    "google-genai>=1.68.0",
    "statsmodels>=0.14.6",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.8",
    "seaborn>=0.13.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "black>=24.0.0",
    "ruff>=0.4.0",
    "jupyter>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src", "experiments"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"
